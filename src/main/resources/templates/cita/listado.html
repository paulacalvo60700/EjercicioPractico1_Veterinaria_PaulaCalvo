<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{general/fragmentos :: head}"></head><body><header th:replace="~{general/fragmentos :: header}"></header><nav th:replace="~{general/fragmentos :: navbar}"></nav><section th:replace="~{general/fragmentos :: mensajes}"></section><main class="container my-5"><h2>Citas programadas</h2><section class="card p-3"><table class="table table-striped"><thead><tr><th>Mascota</th><th>Propietario</th><th>Fecha</th><th>Servicio</th></tr></thead><tbody><tr th:each="c : ${citas}"><td th:text="${c.nombreMascota}"></td><td th:text="${c.nombrePropietario}"></td><td th:text="${#temporals.format(c.fecha,'dd/MM/yyyy')}"></td><td th:text="${c.servicio.nombre}"></td></tr></tbody></table></section></main><footer th:replace="~{general/fragmentos :: footer}"></footer></body></html>
