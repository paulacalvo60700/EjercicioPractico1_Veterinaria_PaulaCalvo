<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{general/fragmentos :: head}"></head><body><header th:replace="~{general/fragmentos :: header}"></header><nav th:replace="~{general/fragmentos :: navbar}"></nav><section th:replace="~{general/fragmentos :: mensajes}"></section><main class="container my-5"><h2>Tipos de servicio</h2><section class="row g-4"><section class="col-lg-8"><section class="card p-3"><table class="table table-striped"><thead><tr><th>Nombre</th><th>Descripción</th><th>Cantidad de servicios</th><th>Acciones</th></tr></thead><tbody><tr th:each="item : ${tipos}"><td th:text="${item.nombre}"></td><td th:text="${item.descripcion}"></td><td th:text="${item.cantidadServicios}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/tipoServicio/modificar/{id}(id=${item.id})}">Editar</a><button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" th:attr="data-bs-target='#borrar'+${item.id}">Eliminar</button><section class="modal fade" th:id="'borrar'+${item.id}" tabindex="-1"><section class="modal-dialog"><section class="modal-content"><section class="modal-header"><h5>Confirmar eliminación</h5><button class="btn-close" data-bs-dismiss="modal"></button></section><section class="modal-body">¿Desea eliminar este registro?</section><section class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><form th:action="@{/tipoServicio/eliminar}" method="post"><input type="hidden" name="id" th:value="${item.id}"><button class="btn btn-danger">Eliminar</button></form></section></section></section></section></td></tr></tbody></table></section></section><section class="col-lg-4"><h4>Agregar</h4><section th:replace="~{tipoServicio/fragmentos :: formulario}"></section></section></section></main><footer th:replace="~{general/fragmentos :: footer}"></footer></body></html>
