<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="formulario"><form th:action="@{/servicio/guardar}" th:object="${dato}" method="post" class="card p-4"><input type="hidden" th:field="*{id}"><label class="form-label">Nombre<input class="form-control" type="text"  th:field="*{nombre}" required></label><label class="form-label">Precio<input class="form-control" type="number" min="0" step="0.01" th:field="*{precio}" required></label><label class="form-label">Duración en minutos<input class="form-control" type="number" min="0" step="1" th:field="*{duracionMinutos}" required></label><label class="form-label">Tipo de servicio<select class="form-select" th:field="*{tipoServicio.id}" required><option value="">Seleccione</option><option th:each="t : ${tipos}" th:value="${t.id}" th:text="${t.nombre}"></option></select></label><button class="btn btn-primary mt-3">Guardar</button></form></section></body></html>
