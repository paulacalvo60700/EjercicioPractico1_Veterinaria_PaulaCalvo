<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

    <head th:fragment="head">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Huellitas - Clínica Veterinaria</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">

        <style>
            body {
                background-color: #fff5f9 !important;
                color: #654456;
                font-family: Arial, sans-serif;
            }

            .navbar,
            .bg-success,
            .bg-primary,
            .bg-dark {
                background-color: #d67fa8 !important;
            }

            .navbar-brand,
            .navbar .nav-link {
                color: white !important;
            }

            .navbar .nav-link:hover {
                color: #ffe5f0 !important;
            }

            header {
                background-color: #f8c8dc !important;
                color: #8e4169 !important;
                padding: 20px;
                text-align: center;
            }

            footer {
                background-color: #d67fa8 !important;
                color: white !important;
                padding: 20px;
                text-align: center;
                margin-top: 40px;
            }

            h1, h2, h3, h4, h5 {
                color: #a94e7b;
            }

            .hero {
                background-color: #fce1ed !important;
                border-radius: 18px;
                padding: 35px;
            }

            .card {
                background-color: #fffafd !important;
                border: 1px solid #f2bfd6 !important;
                border-radius: 15px;
            }

            .btn-primary,
            .btn-success {
                background-color: #d67fa8 !important;
                border-color: #d67fa8 !important;
                color: white !important;
            }

            .btn-primary:hover,
            .btn-success:hover {
                background-color: #b95f8b !important;
                border-color: #b95f8b !important;
            }

            .btn-outline-primary,
            .btn-outline-success {
                color: #b95f8b !important;
                border-color: #d67fa8 !important;
            }

            .btn-outline-primary:hover,
            .btn-outline-success:hover {
                background-color: #d67fa8 !important;
                border-color: #d67fa8 !important;
                color: white !important;
            }

            .text-success,
            .text-primary {
                color: #a94e7b !important;
            }

            .table-success,
            .table-primary {
                --bs-table-bg: #fce1ed;
                --bs-table-color: #654456;
            }

            .table thead th {
                background-color: #f8c8dc;
                color: #8e4169;
            }

            .alert-success {
                background-color: #fce1ed !important;
                border-color: #f2bfd6 !important;
                color: #a94e7b !important;
            }

            .form-control:focus,
            .form-select:focus {
                border-color: #d67fa8 !important;
                box-shadow: 0 0 0 0.25rem rgba(214, 127, 168, 0.25) !important;
            }

            .modal-header {
                background-color: #fce1ed !important;
            }

            a {
                color: #a94e7b;
            }

            a:hover {
                color: #8e4169;
            }
        </style>
    </head>

    <body>

        <!-- Header -->
        <header th:fragment="header">
            <section class="container">
                <h1>Huellitas</h1>
                <p class="mb-0">
                    Clínica Veterinaria - Cuidamos a quienes más querés
                </p>
            </section>
        </header>

        <!-- Navbar -->
        <nav th:fragment="navbar"
             class="navbar navbar-expand-lg navbar-dark">

            <section class="container">

                <a class="navbar-brand" th:href="@{/}">
                    Huellitas
                </a>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#menuPrincipal"
                        aria-controls="menuPrincipal"
                        aria-expanded="false"
                        aria-label="Abrir menú">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <section class="collapse navbar-collapse"
                         id="menuPrincipal">

                    <ul class="navbar-nav ms-auto">

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/}">
                                Inicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/tipoServicio/listado}">
                                Tipos de servicio
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/servicio/listado}">
                                Servicios
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/cita/listado}">
                                Citas
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link"
                               th:href="@{/consulta}">
                                Contacto
                            </a>
                        </li>

                    </ul>

                </section>

            </section>

        </nav>

        <!-- Mensajes -->
        <section th:fragment="mensajes"
                 class="container mt-3">

            <section th:if="${success != null}"
                     class="alert alert-success alert-dismissible fade show"
                     role="alert">

                <span th:text="${success}"></span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Cerrar">
                </button>

            </section>

            <section th:if="${error != null}"
                     class="alert alert-danger alert-dismissible fade show"
                     role="alert">

                <span th:text="${error}"></span>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Cerrar">
                </button>

            </section>

        </section>

        <!-- Footer -->
        <footer th:fragment="footer">

            <section class="container">

                <p class="mb-1">
                    Huellitas - Clínica Veterinaria
                </p>

                <p class="mb-2">
                    Heredia, Costa Rica
                </p>

                <p class="mb-0">
                    © 2026 Huellitas. Todos los derechos reservados.
                </p>

            </section>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        </footer>

    </body>

</html>
